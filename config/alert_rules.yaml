alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 2000 ms'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602870
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateOrRetrievalFailure
    severity: critical
    condition: 'error_rate_pct > 2 OR retrieval_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602870
    runbook: docs/alerts.md#alert-2
  - name: CostPerRequestSpike
    severity: warning
    condition: 'sum(response_sent.cost_usd) / count(response_sent) > 0.005 USD'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602870
    runbook: docs/alerts.md#alert-3
